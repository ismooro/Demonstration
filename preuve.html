<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>L'art de la preuve — rédiger une démonstration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@500;700&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f2f5fa; --sheet:#ffffff; --tint:#eef3fb; --tint2:#fff7e0;
  --grid:rgba(60,110,200,.22); --grid2:rgba(60,110,200,.09); --margin:#ee8b91;
  --ink:#14224a; --ink2:#4a5677; --line:#d3dbe9;
  --accent:#2340b5; --accent-ink:#ffffff; --red:#d6242f; --green:#1c7c4c; --amber:#9a6200;
  --hl:rgba(255,214,64,.6);
  --ok-bg:#ddf3e6; --ko-bg:#fde4e2; --blank:#fff3c4;
  --shadow:0 1px 0 rgba(20,34,74,.06),0 16px 32px -20px rgba(20,34,74,.4);
  --f-ui:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-text:"STIX Two Text","Cambria Math","Times New Roman",Georgia,serif;
  --f-hand:"Caveat","Bradley Hand","Segoe Script","Comic Sans MS",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131d1a; --sheet:#1a2723; --tint:#213230; --tint2:#2d3122;
    --grid:rgba(225,238,230,.11); --grid2:rgba(225,238,230,.05); --margin:#94575a;
    --ink:#eeeadb; --ink2:#b4b8a8; --line:#33443e;
    --accent:#9db8ff; --accent-ink:#10203f; --red:#ff9488; --green:#86dfae; --amber:#f0c261;
    --hl:rgba(240,200,70,.3);
    --ok-bg:#1d4030; --ko-bg:#4a2825; --blank:#3b3b22;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 32px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#131d1a; --sheet:#1a2723; --tint:#213230; --tint2:#2d3122;
  --grid:rgba(225,238,230,.11); --grid2:rgba(225,238,230,.05); --margin:#94575a;
  --ink:#eeeadb; --ink2:#b4b8a8; --line:#33443e;
  --accent:#9db8ff; --accent-ink:#10203f; --red:#ff9488; --green:#86dfae; --amber:#f0c261;
  --hl:rgba(240,200,70,.3);
  --ok-bg:#1d4030; --ko-bg:#4a2825; --blank:#3b3b22;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 16px 32px -20px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 9rem);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;color:var(--ink);background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px);
  background-size:32px 32px,32px 32px,8px 8px;
  font:400 1.0625rem/1.68 var(--f-text)}
[hidden]{display:none!important}
p{margin:.6em 0;max-width:68ch}
b,strong{font-weight:600}
i{font-style:italic}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font-family:inherit}

/* ---------- en-tête ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.top-in{max-width:1040px;margin:0 auto;padding:.65rem clamp(12px,3vw,28px) 0}
.row1{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand h1{margin:0;font:800 clamp(1.3rem,3.6vw,1.8rem)/1.05 var(--f-ui);letter-spacing:-.02em}
.brand h1 .qed{color:var(--red);margin-left:.15em}
.brand small{display:block;margin-top:.15rem;font:500 .82rem var(--f-ui);color:var(--ink2)}
.tools{display:flex;align-items:center;gap:.75rem}
.gauge{display:flex;align-items:center;gap:.5rem;font:600 .8rem var(--f-ui);color:var(--ink2)}
.bar{width:86px;height:8px;border-radius:99px;background:var(--tint);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-size:1.05rem;cursor:pointer;line-height:1}
.icon-btn:hover{background:var(--tint)}
.nav{display:flex;gap:.45rem;overflow-x:auto;padding:.6rem 0 .75rem;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.nav::-webkit-scrollbar{display:none}
.nav-chip{flex:none;display:inline-flex;align-items:center;gap:.45rem;padding:.35rem .75rem .35rem .4rem;border:1.5px solid var(--line);border-radius:999px;background:var(--sheet);color:var(--ink);font:600 .86rem var(--f-ui);cursor:pointer;white-space:nowrap}
.nav-chip:hover{border-color:var(--accent)}
.nav-chip .ico{display:grid;place-items:center;min-width:1.65rem;height:1.65rem;padding:0 .2rem;border-radius:999px;background:var(--tint);font:italic 600 .85rem var(--f-text)}
.nav-chip .cnt{font:600 .72rem var(--f-ui);color:var(--ink2)}
.nav-chip.complete .cnt{color:var(--green)}
.nav-chip[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.nav-chip[aria-current="page"] .ico{background:var(--paper);color:var(--ink)}
.nav-chip[aria-current="page"] .cnt{color:var(--paper);opacity:.85}

/* ---------- feuille ---------- */
main{max-width:1040px;margin:0 auto;padding:clamp(14px,3vw,30px) clamp(10px,3vw,28px) 2.5rem}
.tech{position:relative;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  padding:clamp(20px,4vw,42px) clamp(16px,4vw,48px) clamp(24px,4vw,42px) clamp(36px,7vw,86px);animation:fade .25s ease-out}
.tech::before{content:"";position:absolute;top:0;bottom:0;left:clamp(20px,4.4vw,58px);width:2px;background:var(--margin)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.tech{animation:none}.bar i{transition:none}}
.tech-head{display:flex;gap:1.1rem;align-items:center;margin-bottom:1.2rem}
.glyph{flex:none;min-width:1.2em;text-align:center;font:italic 700 clamp(2.6rem,7vw,4.4rem)/1 var(--f-text);color:transparent;-webkit-text-stroke:1.6px var(--red)}
.tech-head h2{margin:0 0 .3rem;font:800 clamp(1.6rem,4.4vw,2.35rem)/1.08 var(--f-ui);letter-spacing:-.02em}
.lead{margin:0;color:var(--ink2);font-size:1.08rem}
.blk{margin-top:2.3rem}
.blk>h3{display:flex;align-items:baseline;gap:.6rem;margin:0 0 .8rem;font:700 1.3rem/1.2 var(--f-ui);letter-spacing:-.01em}
.blk>h3 .ttl{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:6px}
.mini{margin-left:auto;font:600 .8rem var(--f-ui);color:var(--ink2)}
mark{background:linear-gradient(transparent 52%,var(--hl) 52%);color:inherit;padding:0 .08em}
u{text-decoration-color:var(--red);text-underline-offset:3px}
.m{white-space:normal}
.m sup,.m sub{font-size:.7em;line-height:0}
.ss{display:inline-flex;flex-direction:column;justify-content:center;vertical-align:middle;font-size:.68em;line-height:1.1;text-align:center;margin:0 .1em}
.sig{font-size:1.4em;line-height:.8;vertical-align:-.1em}
.rad{white-space:nowrap}.ov{border-top:1.5px solid currentColor;padding:0 .08em;margin-left:.04em}
.note{margin:.8rem 0;padding:.7rem 1rem;border-left:4px solid var(--amber);background:var(--tint2);border-radius:0 8px 8px 0}

/* ---------- boutons ---------- */
.btn{font:600 .9rem var(--f-ui);padding:.5rem 1rem;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--tint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:.28rem .75rem;font-size:.8rem}

/* ---------- intro, squelette, tableaux ---------- */
.how{margin:0 0 .5rem;padding:1rem 1.2rem;border-radius:10px;background:var(--tint);border:1px solid var(--line)}
.how-t{margin:0 0 .3rem;font:700 1rem var(--f-ui)}
.how ol{margin:0;padding-left:1.3rem}.how li{margin:.25rem 0}
.skel{list-style:none;counter-reset:s;margin:0;padding:.9rem 1.1rem;border:2px dashed var(--ink2);border-radius:10px;background:var(--tint)}
.skel li{counter-increment:s;position:relative;padding-left:2.3rem;margin:.6rem 0}
.skel li::before{content:counter(s);position:absolute;left:0;top:.15em;width:1.55rem;height:1.55rem;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 .78rem var(--f-ui)}
.conn{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem}
.cg{padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet)}
.cg h4{margin:0 0 .35rem;font:700 .95rem var(--f-ui);color:var(--red)}
.cg p{margin:0}
.w{display:inline-block;margin:.15rem .25rem .15rem 0;padding:.1rem .55rem;border-radius:6px;background:var(--tint);border:1px solid var(--line);font-style:italic;font-size:.97rem}
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;width:100%;font-size:.98rem}
.tbl th,.tbl td{padding:.5rem .75rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font:700 .88rem var(--f-ui);border-bottom:2px solid var(--ink)}
.yes{color:var(--green);font-weight:700}.no{color:var(--red);font-weight:700}
.pick{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;text-align:left;margin:.4rem 0;padding:.6rem .9rem;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);color:inherit;font:inherit;cursor:pointer}
.pick:hover{border-color:var(--accent);background:var(--tint)}
.pick .tag{flex:none;padding:.15rem .65rem;border-radius:999px;background:var(--ink);color:var(--paper);font:600 .8rem var(--f-ui)}

/* ---------- copie annotée ---------- */
.copy{border:1px solid var(--line);border-radius:10px;background:var(--tint);padding:1rem clamp(.8rem,2.5vw,1.4rem) .6rem}
.copy-head{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:flex-start;justify-content:space-between}
.stmt{margin:.1rem 0 .6rem;font-weight:600}
.proof{list-style:none;counter-reset:p;margin:0;padding:0}
.proof>li{counter-increment:p;position:relative;display:grid;grid-template-columns:1fr;gap:.2rem 1.8rem;padding:.8rem 0 .8rem 2.5rem;border-top:1px dashed var(--line)}
.proof>li:first-child{border-top:0}
.proof>li::before{content:counter(p);position:absolute;left:0;top:.95rem;width:1.65rem;height:1.65rem;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font:600 .75rem var(--f-ui);color:var(--ink2)}
.pt{font-size:1.1rem}
.pn{font:600 1.28rem/1.12 var(--f-hand);color:var(--red)}
.pn>span::before{content:"↳ "}
@media (min-width:860px){
  .proof>li{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
  .pn{transform:rotate(-.7deg);padding-top:.1rem}
  .pn>span::before{content:"← "}
}
.copy.hide-notes .pn{display:none}
.copy.hide-notes .proof>li{grid-template-columns:1fr}
.legend{margin:.3rem 0 .5rem;font:400 .86rem var(--f-ui);color:var(--ink2)}

/* ---------- textes à trous ---------- */
.cloze{margin:1.1rem 0;padding:1rem clamp(.9rem,2.5vw,1.4rem) 1.1rem;border:1.5px solid var(--ink2);border-radius:12px;background:var(--tint)}
.cz-title{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin:0 0 .3rem;font:700 1.08rem var(--f-ui)}
.cz-title::before{content:"À compléter";padding:.12rem .55rem;border-radius:6px;background:var(--red);color:var(--accent-ink);font:600 .75rem var(--f-ui)}
.is-done .cz-title::after,.qcm.prev-ok .q::after{content:"✓ déjà réussi";margin-left:.6rem;padding:.08rem .5rem;border-radius:999px;background:var(--ok-bg);color:var(--green);font:600 .74rem var(--f-ui);vertical-align:.1em}
.cz-text{margin:.6rem 0;padding:.5rem 1rem;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.cz-text p{margin:.15rem 0;line-height:2.25;max-width:none}
.blank{font:inherit;font-size:1em;color:var(--ink);text-align:center;padding:.02em .3em;margin:0 .1em;border:0;border-bottom:2px dashed var(--ink2);border-radius:4px 4px 0 0;background:var(--blank);min-width:3.5ch}
.blank::placeholder{color:var(--ink2);opacity:.7;font-size:.8em}
.blank:focus{outline:none;border-bottom-color:var(--accent);box-shadow:0 2px 0 var(--accent)}
.blank.target{box-shadow:0 0 0 2px var(--accent)}
.blank.ok{background:var(--ok-bg);border-bottom:2px solid var(--green)}
.blank.ko{background:var(--ko-bg);border-bottom:2px solid var(--red)}
.blank.shown{background:var(--tint);border-bottom:2px solid var(--accent)}
.cz-actions{display:flex;flex-wrap:wrap;gap:.5rem}
.cz-fb{min-height:1.5em;margin:.6rem 0 0;font:500 .95rem var(--f-ui)}
.cz-fb.good{color:var(--green)}.cz-fb.warn{color:var(--amber)}
.cz-hints,.cz-bank{margin:.6rem 0 0;padding:.6rem .9rem;border-radius:8px;background:var(--sheet);border:1px dashed var(--ink2);font:400 .95rem var(--f-ui)}
.cz-hints ol{margin:0;padding-left:1.2rem}.cz-hints li{margin:.2rem 0}
.cz-bank{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.15rem .65rem;border:1px solid var(--ink2);border-radius:999px;background:var(--sheet);color:inherit;font:400 .98rem var(--f-text);cursor:pointer}
.chip:hover{background:var(--hl)}

/* ---------- QCM ---------- */
.qcm{margin:1rem 0;padding:1rem 1.1rem;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet)}
.qcm .q{margin:.1rem 0 .7rem;font-weight:500;max-width:none}
.qn{display:inline-block;margin-right:.6rem;padding:.05rem .5rem;border-radius:6px;background:var(--ink);color:var(--paper);font:700 .78rem var(--f-ui);vertical-align:.12em}
.opts{display:grid;gap:.5rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;width:100%;text-align:left;padding:.6rem .8rem;border:1.5px solid var(--line);border-radius:10px;background:var(--tint);color:inherit;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;width:1.55rem;height:1.55rem;margin-top:.12rem;border-radius:50%;border:1.5px solid var(--ink2);display:grid;place-items:center;font:700 .75rem var(--f-ui)}
.opt:disabled{cursor:default;color:inherit}
.opt:disabled:not(.right):not(.wrong){opacity:.55}
.opt.right{background:var(--ok-bg);border-color:var(--green)}
.opt.right .l{background:var(--green);border-color:var(--green);color:var(--accent-ink);font-size:0}
.opt.right .l::after{content:"✓";font-size:.85rem}
.opt.wrong{background:var(--ko-bg);border-color:var(--red)}
.opt.wrong .l{background:var(--red);border-color:var(--red);color:var(--accent-ink);font-size:0}
.opt.wrong .l::after{content:"✗";font-size:.85rem}
.why{margin-top:.7rem;padding:.6rem .9rem;border-left:4px solid var(--ink2);border-radius:0 8px 8px 0;font-size:1rem}
.why p{margin:.2rem 0;max-width:none}
.is-ok .why{border-color:var(--green);background:var(--ok-bg)}
.is-ko .why{border-color:var(--red);background:var(--ko-bg)}

/* ---------- pièges ---------- */
.pit{margin:.9rem 0}
.pit-grid{display:grid;grid-template-columns:1fr;gap:.5rem}
@media (min-width:720px){.pit-grid{grid-template-columns:1fr 1fr}}
.bad,.good{padding:.6rem .9rem;border-radius:0 8px 8px 0}
.bad{border-left:4px solid var(--red);background:var(--ko-bg)}
.good{border-left:4px solid var(--green);background:var(--ok-bg)}
.bad b,.good b{display:block;font:700 .82rem var(--f-ui);margin-bottom:.1rem}
.bad b{color:var(--red)}.good b{color:var(--green)}
.pwhy{margin:.4rem 0 0;font:400 .92rem var(--f-ui);color:var(--ink2)}

/* ---------- navigation bas de page, défi ---------- */
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.8rem;margin-top:2.4rem;padding-top:1.2rem;border-top:2px solid var(--ink)}
.scorebox{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.2rem;margin:0 0 1rem;padding:.8rem 1.1rem;border:2px solid var(--ink);border-radius:12px;font:600 1rem var(--f-ui)}
.scorebox .big{font:800 2.2rem/1 var(--f-ui)}
footer{max-width:1040px;margin:0 auto;padding:0 clamp(12px,3vw,28px) 2.5rem;display:flex;flex-wrap:wrap;gap:.8rem;justify-content:space-between;align-items:center;color:var(--ink2);font:400 .85rem var(--f-ui)}
@media (max-width:560px){.brand small,.gauge span{display:none}.bar{width:60px}.tech-head{gap:.7rem}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="row1">
      <div class="brand">
        <h1>L'art de la preuve<span class="qed" aria-hidden="true">∎</span></h1>
        <small>Rédiger une démonstration : récurrence, absurde, contraposée…</small>
      </div>
      <div class="tools">
        <div class="gauge" title="Ta progression"><span id="gauge-txt">0 %</span><div class="bar"><i id="gauge-bar"></i></div></div>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Changer de thème">☾</button>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Chapitres"></nav>
  </div>
</header>
<main id="main" tabindex="-1"><noscript><p>Ce site a besoin de JavaScript pour afficher les exercices.</p></noscript></main>
<footer>
  <span>Ta progression est enregistrée dans ce navigateur.</span>
  <button type="button" class="btn sm" data-act="resetall">Réinitialiser ma progression</button>
</footer>
<script>
(function(){
"use strict";
/* ================= utilitaires ================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const attr=s=>esc(s).replace(/"/g,"&quot;");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;};
const strip=t=>t.charAt(0)==="{"?t.slice(1,-1):t;

/* mini-moteur de maths : $ ... $  avec ^ _ ∑ √{...} */
function math(src){
  let s=src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/-/g,"−");
  s=s.replace(/[A-Za-z]+/g,m=>m.length===1?"<i>"+m+"</i>":m);
  s=s.replace(/√\{([^}]*)\}/g,'<span class="rad">√<span class="ov">$1</span></span>');
  s=s.replace(/_\{([^}]*)\}\^\{([^}]*)\}/g,'<span class="ss"><span>$2</span><span>$1</span></span>');
  s=s.replace(/\^(\{[^}]*\}|<i>[A-Za-z]<\/i>|[0-9]|\*)/g,(m,t)=>"<sup>"+strip(t)+"</sup>");
  s=s.replace(/_(\{[^}]*\}|<i>[A-Za-z]<\/i>|[0-9])/g,(m,t)=>"<sub>"+strip(t)+"</sub>");
  s=s.replace(/∑/g,'<span class="sig">∑</span>');
  return '<span class="m">'+s+"</span>";
}
function rich(s){
  return String(s).replace(/\$([^$]+)\$/g,(m,a)=>math(a))
    .replace(/ ([:;?!»])/g,"\u00a0$1").replace(/«(?: |\u00a0)/g,"«\u00a0");
}
/* normalisation des réponses saisies */
function norm(s){
  return String(s).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[’‘`´]/g,"'").replace(/[−–—]/g,"-")
    .replace(/²/g,"^2").replace(/³/g,"^3")
    .replace(/>=/g,"≥").replace(/<=/g,"≤")
    .replace(/[×·*]/g,"").replace(/[\s.,;:!?]/g,"");
}

/* ================= blocs génériques (chapitre « bases ») ================= */
const CONN=[
 ["Introduire",["Soit","Posons","Notons","Considérons","Fixons","Supposons que"]],
 ["Justifier",["car","puisque","comme","or","par hypothèse","par définition","d'après le théorème de …"]],
 ["Déduire",["donc","ainsi","d'où","par conséquent","on en déduit que","il vient que"]],
 ["Structurer",["Cas 1 / Cas 2","Réciproquement","Initialisation","Hérédité","Analyse","Synthèse"]],
 ["Conclure",["dans tous les cas","ce qui prouve que","CQFD","∎"]]
];
function connHTML(){

/* ================= rendu ================= */
function renderExample(ex){
  return '<div class="copy"><div class="copy-head"><p class="stmt">'+rich(ex.statement)+'</p>'+
   '<button type="button" class="btn sm" data-act="notes" aria-pressed="false">Masquer les annotations</button></div>'+
   '<ol class="proof">'+ex.lines.map(l=>'<li><div class="pt">'+rich(l[0])+'</div><div class="pn"><span>'+rich(l[1])+"</span></div></li>").join("")+"</ol>"+
   '<p class="legend">Les mots <mark>surlignés</mark> sont les mots de liaison à retenir.</p></div>';
}
function renderCloze(c){
  const order=[];
  const paras=c.text.split("\n").map(p=>{
    const parts=p.split(/\[\[(\w+)\]\]/);
    let out="";
    for(let i=0;i<parts.length;i++){
      if(i%2===0){out+=rich(parts[i]);}
      else{
        const k=parts[i];order.push(k);
        const b=c.blanks[k];
        const w=Math.min(28,Math.max(5,b.a[0].length+3));
        out+='<input class="blank" type="text" data-b="'+k+'" placeholder="'+order.length+'" aria-label="Trou '+order.length+'" style="width:'+w+'ch" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next">';
      }
    }
    return "<p>"+out+"</p>";
  }).join("");
  const seen={};
  const bank=shuffle(order.map(k=>c.blanks[k].a[0]).concat(c.extra||[]).filter(x=>seen[x]?false:(seen[x]=true)));
  return '<div class="cloze'+(P.cloze[c.id]?" is-done":"")+'" data-id="'+c.id+'">'+
   '<h4 class="cz-title">'+rich(c.title)+"</h4>"+
   '<p class="stmt">'+rich(c.statement)+"</p>"+
   '<div class="cz-text">'+paras+"</div>"+
   '<div class="cz-actions">'+
    '<button type="button" class="btn primary sm" data-act="check">Vérifier</button>'+
    '<button type="button" class="btn sm" data-act="hint">Indice</button>'+
    '<button type="button" class="btn sm" data-act="bank">Banque de mots</button>'+
    '<button type="button" class="btn sm" data-act="show">Voir la solution</button>'+
    '<button type="button" class="btn sm" data-act="reset">Recommencer</button>'+
   "</div>"+
   '<p class="cz-fb" aria-live="polite"></p>'+
   '<div class="cz-hints" hidden><ol>'+order.map(k=>"<li>"+rich(c.blanks[k].h)+"</li>").join("")+"</ol></div>"+
   '<div class="cz-bank" hidden>'+bank.map(x=>'<button type="button" class="chip" data-v="'+attr(x)+'">'+esc(x)+"</button>").join("")+"</div>"+
   "</div>";
}
function renderQcm(q,key,n,mode){
  const prev=(mode!=="defi"&&P.qcm[key])?" prev-ok":"";
  return '<div class="qcm'+prev+'" data-key="'+key+'"'+(mode?' data-mode="'+mode+'"':"")+">"+
   '<p class="q"><span class="qn">Q'+n+"</span>"+rich(q.q)+"</p>"+
   '<div class="opts">'+q.o.map((o,i)=>'<button type="button" class="opt" data-i="'+i+'"><span class="l">'+"ABCD".charAt(i)+'</span><span class="t">'+rich(o)+"</span></button>").join("")+"</div>"+
   '<div class="why" hidden></div></div>';
}
function renderPits(list){
  return list.map(p=>'<div class="pit"><div class="pit-grid"><div class="bad"><b>À éviter</b>'+rich(p.bad)+'</div><div class="good"><b>À écrire</b>'+rich(p.good)+'</div></div><p class="pwhy">'+rich(p.why)+"</p></div>").join("");
}
function pager(ti){
  const prev=ti>0?TECHS[ti-1]:null;
  const next=ti<TECHS.length-1?TECHS[ti+1]:{id:"defi",nav:"Le défi final"};
  return '<div class="pager">'+(prev?'<button type="button" class="btn" data-go="'+prev.id+'">Chapitre précédent : '+esc(prev.nav)+"</button>":"<span></span>")+
   '<button type="button" class="btn primary" data-go="'+next.id+'">Chapitre suivant : '+esc(next.nav)+"</button></div>";
}
function renderTech(t,ti){
  const blk=(title,body,head)=>'<section class="blk"><h3><span class="ttl">'+title+"</span>"+(head||"")+"</h3>"+body+"</section>";
  let h='<article class="tech" data-tech="'+t.id+'">';
  h+='<header class="tech-head"><span class="glyph" aria-hidden="true">'+esc(t.icon)+'</span><div><h2>'+esc(t.title)+'</h2><p class="lead">'+rich(t.lead)+"</p></div></header>";
  if(t.intro)h+=introHTML();
  h+=blk("Le principe",t.principle.map(p=>"<p>"+rich(p)+"</p>").join(""));
  h+=blk("Le squelette de rédaction",'<ol class="skel">'+t.skeleton.map(s=>"<li>"+rich(s)+"</li>").join("")+"</ol>");
  (t.extras||[]).forEach(x=>{h+=blk(x.title,rich(typeof x.html==="function"?x.html():x.html));});
  h+=blk("Un exemple annoté",renderExample(t.example));
  h+=blk("À toi de compléter",t.cloze.map(renderCloze).join(""));
  h+=blk("QCM : quelle formulation ?",t.qcm.map((q,i)=>renderQcm(q,q.key,i+1)).join(""),'<span class="mini" data-score="'+t.id+'"></span>');
  h+=blk("Pièges classiques",renderPits(t.pits));
  h+=pager(ti)+"</article>";
  return h;
}

   '<p class="lead">Dix questions tirées au hasard dans tous les chapitres, dont des questions « quelle technique choisir ? ». Pas d\'indice : à toi de jouer.</p></div></header>'+
   '<div class="scorebox" id="defiScore" aria-live="polite"></div>'+

function updateDefiScore(){
  const box=$("#defiScore");if(!box)return;
  const list=$("#defiList");
  const ok=$$(".qcm.is-ok",list).length,ko=$$(".qcm.is-ko",list).length,done=ok+ko;
  let msg="Réponds aux questions ci-dessous.";
  if(done===draw.length){msg=ok>=9?"Impeccable : tes formulations sont au point.":ok>=6?"Solide. Relis les chapitres où tu as hésité.":"Reprends les chapitres un par un, puis retente un nouveau tirage.";}
  else if(done>0){msg=done+" question"+(done>1?"s":"")+" sur "+draw.length;}
  box.innerHTML='<span class="big">'+ok+" / "+draw.length+"</span><span>"+msg+"</span>";
}

/* ================= progression ================= */
function counts(t){
  let done=0;
  t.cloze.forEach(c=>{if(P.cloze[c.id])done++;});
  t.qcm.forEach(q=>{if(P.qcm[q.key])done++;});
  return {done:done,total:t.cloze.length+t.qcm.length};
}
function updateProgressUI(){
  let D=0,T=0;
  TECHS.forEach(t=>{
    const c=counts(t);D+=c.done;T+=c.total;
    const chip=$('.nav-chip[data-id="'+t.id+'"]');
    if(chip){const cnt=$(".cnt",chip);cnt.textContent=c.done===c.total?"✓":c.done+"/"+c.total;chip.classList.toggle("complete",c.done===c.total);}
    const sc=$('[data-score="'+t.id+'"]');
    if(sc){const q=t.qcm.filter(x=>P.qcm[x.key]).length;sc.textContent=q+" / "+t.qcm.length+" réussies";}
  });
  const pct=T?Math.round(100*D/T):0;
  $("#gauge-txt").textContent=pct+" %";
  $("#gauge-bar").style.width=pct+"%";
}

/* ================= textes à trous ================= */
function checkCloze(cz){
  const c=CMAP[cz.dataset.id];
  let ok=0,total=0,empty=0;
  $$(".blank",cz).forEach(inp=>{
    total++;
    inp.classList.remove("ok","ko","shown");
    const v=norm(inp.value);
    if(!v){empty++;return;}
    if(c.blanks[inp.dataset.b].a.some(a=>norm(a)===v)){ok++;inp.classList.add("ok");}else{inp.classList.add("ko");}
  });
  const fb=$(".cz-fb",cz);
  if(ok===total){
    if(cz.dataset.revealed){fb.textContent="Toutes les cases sont justes, mais la solution était affichée : recommence pour valider l'exercice.";fb.className="cz-fb warn";}
    else{fb.textContent="Bravo, ta démonstration est complète et bien rédigée !";fb.className="cz-fb good";
      P.cloze[c.id]=1;save();cz.classList.add("is-done");updateProgressUI();}
  }else{
    let m=ok+" / "+total+" trou"+(total>1?"s":"")+" juste"+(ok>1?"s":"");
    if(empty)m+=" · "+empty+" à remplir";
    if(total-ok-empty>0)m+=" · corrige les cases en rouge";
    fb.textContent=m+".";fb.className="cz-fb warn";
  }
}
function resetCloze(cz){
  $$(".blank",cz).forEach(i=>{i.value="";i.classList.remove("ok","ko","shown","target");});
  delete cz.dataset.revealed;cz._last=null;
  const fb=$(".cz-fb",cz);fb.textContent="";fb.className="cz-fb";
}
function showSolution(cz){
  const c=CMAP[cz.dataset.id];
  $$(".blank",cz).forEach(i=>{i.value=c.blanks[i.dataset.b].a[0];i.classList.remove("ok","ko");i.classList.add("shown");});
  cz.dataset.revealed="1";
  const fb=$(".cz-fb",cz);fb.textContent="Solution affichée. Clique sur « Recommencer » pour refaire l'exercice par toi-même.";fb.className="cz-fb warn";
}
function insertChip(chip){
  const cz=chip.closest(".cloze");
  const inputs=$$(".blank",cz);
  let inp=cz._last&&cz.contains(cz._last)?cz._last:inputs.find(i=>!i.value)||inputs[0];
  inp.value=chip.dataset.v;inp.classList.remove("ok","ko","shown","target");
  const idx=inputs.indexOf(inp);
  const next=inputs.slice(idx+1).concat(inputs.slice(0,idx)).find(i=>!i.value);
  inputs.forEach(i=>i.classList.remove("target"));
  if(next){next.classList.add("target");cz._last=next;}else{cz._last=inp;}
}

/* ================= QCM ================= */
function answer(opt){
  const box=opt.closest(".qcm");if(box.dataset.done)return;
  const q=QMAP[box.dataset.key];const i=+opt.dataset.i;const ok=i===q.a;
  const defi=box.dataset.mode==="defi";
  box.dataset.done="1";box.classList.add(ok?"is-ok":"is-ko");
  $$(".opt",box).forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===i)b.classList.add("wrong");});
  const why=$(".why",box);
  why.innerHTML="<p><b>"+(ok?"Exact.":"Pas tout à fait.")+"</b> "+rich(q.ex)+"</p>"+
    ((!ok&&!defi)?'<button type="button" class="btn sm" data-act="retry">Réessayer cette question</button>':"");
  why.hidden=false;
  if(defi){updateDefiScore();}
  else if(ok){P.qcm[q.key]=1;save();updateProgressUI();}
}
function retry(box){
  delete box.dataset.done;box.classList.remove("is-ok","is-ko");
  $$(".opt",box).forEach(b=>{b.disabled=false;b.classList.remove("right","wrong");});
  const why=$(".why",box);why.hidden=true;why.innerHTML="";
}

/* ================= événements ================= */
let confirmReset=false,confirmTimer=0;
function act(btn){
  const a=btn.dataset.act;
  const cz=btn.closest(".cloze");
  if(a==="check")checkCloze(cz);
  else if(a==="hint"){const h=$(".cz-hints",cz);h.hidden=!h.hidden;}
  else if(a==="bank"){const b=$(".cz-bank",cz);b.hidden=!b.hidden;}
  else if(a==="show")showSolution(cz);
  else if(a==="reset")resetCloze(cz);
  else if(a==="retry")retry(btn.closest(".qcm"));
  else if(a==="notes"){const copy=btn.closest(".copy");const h=copy.classList.toggle("hide-notes");btn.setAttribute("aria-pressed",h?"true":"false");btn.textContent=h?"Afficher les annotations":"Masquer les annotations";}
  else if(a==="newdraw"){draw=[];main.innerHTML=renderDefi();updateDefiScore();window.scrollTo(0,0);}
  else if(a==="resetall"){
    if(!confirmReset){confirmReset=true;btn.textContent="Sûr ? Clique encore pour effacer";clearTimeout(confirmTimer);confirmTimer=setTimeout(()=>{confirmReset=false;btn.textContent="Réinitialiser ma progression";},3500);}
    else{confirmReset=false;clearTimeout(confirmTimer);btn.textContent="Réinitialiser ma progression";P={cloze:{},qcm:{}};save();show(cur,true);}
  }
}
document.addEventListener("click",e=>{
  const t=e.target;let n;
  if((n=t.closest("[data-go]"))){go(n.dataset.go);return;}
  if((n=t.closest(".opt"))){answer(n);return;}
  if((n=t.closest(".chip"))){insertChip(n);return;}
  if((n=t.closest(".nav-chip"))){go(n.dataset.id);return;}
  if((n=t.closest("[data-act]"))){act(n);return;}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("blank"))t.classList.remove("ok","ko","shown");
});
document.addEventListener("focusin",e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains("blank")){const cz=t.closest(".cloze");cz._last=t;$$(".blank",cz).forEach(i=>i.classList.remove("target"));}
});
document.addEventListener("keydown",e=>{
  const t=e.target;
  if(e.key==="Enter"&&t.classList&&t.classList.contains("blank")){
    e.preventDefault();
    const cz=t.closest(".cloze");const ins=$$(".blank",cz);const i=ins.indexOf(t);
    if(i<ins.length-1)ins[i+1].focus();else checkCloze(cz);
  }
});

/* ================= thème ================= */
const root=document.documentElement,themeBtn=$("#themeBtn");
const savedTheme=store.get("preuve-theme");
if(savedTheme==="light"||savedTheme==="dark")root.setAttribute("data-theme",savedTheme);
function isDark(){
  const t=root.getAttribute("data-theme");
  if(t)return t==="dark";
  return !!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function themeUI(){
  const d=isDark();
  themeBtn.textContent=d?"☀":"☾";
  const l=d?"Passer en mode clair (cahier)":"Passer en mode sombre (tableau)";
  themeBtn.setAttribute("aria-label",l);themeBtn.title=l;
}
themeBtn.addEventListener("click",()=>{
  const n=isDark()?"light":"dark";
  root.setAttribute("data-theme",n);store.set("preuve-theme",n);themeUI();
});
themeUI();

/* ================= démarrage ================= */
show((window.location.hash||"").replace("#","")||"bases",true);
if(window.__PREUVE_TEST)window.__PREUVE_TEST={TECHS:TECHS,CHOIX:CHOIX,renderTech:renderTech,renderDefi:renderDefi,math:math,rich:rich,norm:norm,CMAP:CMAP};
})();
</script>
